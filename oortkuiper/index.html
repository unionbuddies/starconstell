<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oort Cloud & Kuiper Belt Explorer</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0c3348;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e8f2f8}
    /* Explicit 100% is required: canvas is a replaced element, so inset:0 alone
       leaves width:auto resolving to the intrinsic (attribute) size. */
    #canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

    #loading{position:fixed;inset:0;background:#0c3348;display:flex;flex-direction:column;
      align-items:center;justify-content:center;z-index:999;transition:opacity .6s}
    #loading h2{font-size:22px;font-weight:400;color:#9fc4da;letter-spacing:3px;text-transform:uppercase}
    #loading p{font-size:14px;color:#5b8ba6;margin-top:10px}

    /* ── Top bar ─────────────────────────────────────────────── */
    #topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:flex-start;
      justify-content:space-between;gap:18px;padding:18px 22px;flex-wrap:wrap;pointer-events:none}
    #title-bar h1{font-size:clamp(17px,2vw,24px);font-weight:600;color:#ffffff;letter-spacing:2px;
      text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.5)}
    #title-bar p{font-size:13px;color:#8fb8d0;margin-top:4px;letter-spacing:.4px}

    /* ── Big mode switch: the two structures, kept separate ──── */
    #modes{display:flex;gap:10px;pointer-events:auto}
    .mode-btn{background:rgba(10,50,72,.85);border:2px solid rgba(150,195,220,.35);
      color:#bcd9e9;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;
      letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;font-family:inherit;
      transition:all .2s;backdrop-filter:blur(6px)}
    .mode-btn:hover{background:rgba(20,75,105,.9);color:#ffffff;border-color:rgba(180,220,245,.6)}
    .mode-btn.active{background:#e8f2f8;color:#0d3346;border-color:#ffffff;
      box-shadow:0 4px 18px rgba(200,230,250,.3)}

    #region-label{margin-top:10px;font-size:13px;color:#a8cde2;letter-spacing:1px;
      display:inline-block;background:rgba(9,45,66,.8);border:1px solid rgba(150,195,220,.3);
      border-radius:20px;padding:6px 14px;font-weight:500}

    #tooltip{position:fixed;background:rgba(9,45,66,.95);border:1px solid rgba(160,205,230,.5);
      border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;color:#ffffff;
      pointer-events:none;display:none;z-index:300;backdrop-filter:blur(4px);
      box-shadow:0 4px 16px rgba(0,0,0,.4)}

    /* ── Info panel ──────────────────────────────────────────── */
    #info-panel{position:fixed;right:22px;top:50%;transform:translateY(-50%);
      width:370px;max-height:82vh;overflow-y:auto;background:rgba(9,42,61,.96);
      border:1px solid rgba(150,195,220,.3);border-radius:16px;padding:26px;display:none;z-index:100;
      backdrop-filter:blur(12px);box-shadow:0 10px 50px rgba(0,0,0,.5)}
    #info-panel::-webkit-scrollbar{width:7px}
    #info-panel::-webkit-scrollbar-thumb{background:rgba(160,205,230,.35);border-radius:4px}
    #info-panel .close{position:absolute;top:16px;right:18px;background:none;border:none;
      color:#7ba6c0;cursor:pointer;font-size:22px;line-height:1;padding:2px 6px;border-radius:6px}
    #info-panel .close:hover{color:#fff;background:rgba(255,255,255,.12)}
    #info-panel h2{font-size:24px;color:#ffffff;margin-bottom:5px;font-weight:600;padding-right:28px}
    #info-panel .sub{font-size:12px;color:#8fb8d0;text-transform:uppercase;letter-spacing:1.2px;
      margin-bottom:20px;font-weight:600}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .stat{background:rgba(255,255,255,.07);border-radius:10px;padding:12px}
    .stat-lbl{font-size:10.5px;color:#89b3ca;text-transform:uppercase;letter-spacing:.8px;
      margin-bottom:5px;font-weight:600}
    .stat-val{font-size:16px;color:#ffffff;font-weight:600;line-height:1.3}
    #panel-desc{font-size:15px;color:#d3e6f0;line-height:1.7;margin-bottom:20px}
    .comp-title{font-size:11px;color:#89b3ca;text-transform:uppercase;letter-spacing:1.2px;
      margin-bottom:12px;font-weight:700}
    .comp-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
    .comp-lbl{width:150px;font-size:13px;color:#d3e6f0;flex-shrink:0}
    .comp-bg{flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
    .comp-fill{height:100%;border-radius:4px}
    .comp-pct{font-size:13px;color:#ffffff;width:36px;text-align:right;font-weight:600}

    /* ── Sidebar ─────────────────────────────────────────────── */
    #sidebar{position:fixed;left:22px;bottom:22px;width:224px;z-index:15;
      display:flex;flex-direction:column;gap:12px;max-height:64vh;
      background:rgba(9,42,61,.92);border:1px solid rgba(150,195,220,.28);
      border-radius:14px;padding:16px;backdrop-filter:blur(8px);
      box-shadow:0 6px 30px rgba(0,0,0,.4)}
    #sidebar h3{font-size:11px;color:#89b3ca;text-transform:uppercase;letter-spacing:1.3px;
      margin-bottom:10px;font-weight:700}
    #obj-list{flex:1;overflow-y:auto;min-height:0;margin:-4px}
    #obj-list::-webkit-scrollbar{width:6px}
    #obj-list::-webkit-scrollbar-thumb{background:rgba(160,205,230,.35);border-radius:3px}
    .grp{font-size:10px;color:#6f9db8;text-transform:uppercase;letter-spacing:1.1px;
      margin:11px 4px 6px;font-weight:700}
    .grp:first-child{margin-top:4px}
    .obj-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
      color:#d3e6f0;font-size:14px;text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;
      font-family:inherit;transition:background .15s}
    .obj-btn:hover{background:rgba(255,255,255,.14);color:#fff}
    .obj-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}

    #comet-bar{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:18;
      display:flex;align-items:center;gap:12px;background:rgba(9,42,61,.9);
      border:1px solid rgba(150,195,220,.3);border-radius:24px;padding:7px 16px 7px 8px;
      backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.35)}
    #comet-btn{background:rgba(120,200,235,.18);border:1px solid rgba(160,215,240,.45);
      color:#e8f6ff;border-radius:18px;padding:7px 15px;font-size:13px;font-weight:600;
      cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s}
    #comet-btn:hover{background:rgba(120,200,235,.34)}
    .cb-lbl{font-size:13px;color:#a8cde2;white-space:nowrap}
    .cb-lbl b{color:#ffffff;font-weight:700}
    @media (max-width:1150px){#comet-bar .cb-lbl{display:none}}
    @media (max-width:760px){#comet-bar{top:auto;bottom:16px}}

    #hint{position:fixed;bottom:22px;right:22px;background:rgba(9,42,61,.9);
      border:1px solid rgba(150,195,220,.25);border-radius:10px;padding:11px 16px;font-size:13px;
      color:#8fb8d0;z-index:15;backdrop-filter:blur(6px)}
    #hint b{color:#ffffff;font-weight:600}

    @media (max-width:900px){
      #info-panel{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;
        max-height:56vh;border-radius:16px 16px 0 0}
      #sidebar{width:180px;max-height:48vh}
      #hint{display:none}
    }
    @media (max-height:560px){#sidebar{display:none}}
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="loading"><h2>Loading Explorer</h2><p>Preparing the outer solar system…</p></div>

<div id="topbar">
  <div id="title-bar">
    <h1 id="view-title">Kuiper Belt</h1>
    <p id="view-sub">The icy disk beyond Neptune · 30–55 AU</p>
  </div>
  <div id="modes">
    <button class="mode-btn active" id="btn-kuiper" onclick="setMode('kuiper')">Kuiper Belt</button>
    <button class="mode-btn" id="btn-oort" onclick="setMode('oort')">Oort Cloud</button>
    <button class="mode-btn" id="btn-exo" onclick="setMode('exo')">Other Stars</button>
  </div>
</div>

<div id="comet-bar">
  <button id="comet-btn" onclick="toggleComet()">❚❚ Pause comet</button>
  <span class="cb-lbl">Comet is <b id="comet-dist">—</b> from the Sun</span>
</div>

<div id="tooltip"></div>

<div id="info-panel">
  <button class="close" onclick="closePanel()">✕</button>
  <h2 id="p-title"></h2>
  <div class="sub" id="p-sub"></div>
  <div class="stat-grid" id="p-stats"></div>
  <div id="panel-desc"></div>
  <div id="p-comp"></div>
</div>

<div id="sidebar">
  <div><h3 id="list-title">Jump to Object</h3></div>
  <div id="obj-list"></div>
</div>

<div id="hint"><b>Scroll</b> zoom · <b>Drag</b> rotate · <b>Click</b> objects &amp; dust</div>

// ─── Soft round sprite texture ───────────────────────────────────────────────
function makeCircleTex(size=64){
  const c=document.createElement('canvas');c.width=c.height=size;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.45,'rgba(255,255,255,.65)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const circleTex=makeCircleTex();

function makeGlowTex(size,col){
  const c=document.createElement('canvas');c.width=c.height=size;
  const ctx=c.getContext('2d');
  const r=new THREE.Color(col),R=(r.r*255)|0,G=(r.g*255)|0,B=(r.b*255)|0;
  const g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,`rgba(${R},${G},${B},1)`);
  g.addColorStop(.35,`rgba(${R},${G},${B},.4)`);
  g.addColorStop(1,`rgba(${R},${G},${B},0)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}

// ─── Dust generator ──────────────────────────────────────────────────────────
// `flatten` 0 = perfect sphere, 1 = paper-thin disk. Radii are sampled by
// volume (r³) so a shell brightens toward its limb, exactly like the reference.
function makeDust({count,minAu,maxAu,flatten,size,opacity,color=0xdfeaf2}){
  const pos=new Float32Array(count*3),cols=new Float32Array(count*3);
  const rMin=s(minAu),rMax=s(maxAu);
  const base=new THREE.Color(color);
  for(let i=0;i<count;i++){
    const u=Math.random();
    const r=Math.cbrt(rMin**3+u*(rMax**3-rMin**3));
    const theta=Math.random()*Math.PI*2;
    const cosPhi=(2*Math.random()-1)*(1-flatten)+((Math.random()-.5)*.1*flatten);
    const phi=Math.acos(Math.max(-1,Math.min(1,cosPhi)));
    const sp=Math.sin(phi);
    pos[i*3]=r*sp*Math.cos(theta);
    pos[i*3+1]=r*Math.cos(phi)*(1-flatten*.82);
    pos[i*3+2]=r*sp*Math.sin(theta);
    const br=.72+Math.random()*.28;
    cols[i*3]=base.r*br;cols[i*3+1]=base.g*br;cols[i*3+2]=base.b*br;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
  const mat=new THREE.PointsMaterial({size,map:circleTex,vertexColors:true,transparent:true,
    alphaTest:.02,opacity,depthWrite:false,sizeAttenuation:true});
  // Cap on-screen size, or particles near the camera balloon into blobs
  mat.onBeforeCompile=sh=>{
    sh.vertexShader=sh.vertexShader.replace(
      'if ( isPerspective ) gl_PointSize *= ( scale / - mvPosition.z );',
      'if ( isPerspective ) gl_PointSize *= ( scale / - mvPosition.z );\n\tgl_PointSize = min( gl_PointSize, 6.0 );'
    );
  };
  return new THREE.Points(geo,mat);
}

function addDust(cfg,regionKey,group){
  const pts=makeDust(cfg);
  pts.userData={type:'region',data:REGIONS[regionKey]};
  group.add(pts);
  regionClouds.push(pts);
  return pts;
}

// ─── Orbit ellipses for the named bodies ─────────────────────────────────────
function makeOrbit(a,e,incDeg,color,opacity){
  const inc=incDeg*Math.PI/180;
  const b=a*Math.sqrt(1-e*e);
  const aS=s(a),bS=aS*(b/a),cS=aS*e;
  const pts=[];
  for(let i=0;i<=320;i++){
    const t=(i/320)*Math.PI*2;
    const xo=aS*Math.cos(t)-cS, yo=bS*Math.sin(t);
    pts.push(new THREE.Vector3(xo,yo*Math.sin(inc),yo*Math.cos(inc)));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color,transparent:true,opacity}));
}

  clickables.push(hit);
}

// Tail points run along local +X, which we aim directly away from the Sun
const cometTail=(()=>{
  const N=120,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const t=i/N;
    pos[i*3]=t;
    pos[i*3+1]=(Math.random()-.5)*t*.22;
    pos[i*3+2]=(Math.random()-.5)*t*.22;
    const f=Math.pow(1-t,1.4);
    col[i*3]=.62*f; col[i*3+1]=.85*f; col[i*3+2]=1*f;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:1.5,map:circleTex,vertexColors:true,transparent:true,
    opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
  const p=new THREE.Points(g,m);
  sysGroup.add(p);
  return p;
})();

let cometE=Math.PI, cometPlaying=true;   // start out near aphelion
const X_AXIS=new THREE.Vector3(1,0,0);
function updateComet(dt){
  // Real Kepler motion would park it at aphelion for ~99% of the period, so the
  // eccentric anomaly is advanced uniformly instead — the sweep stays watchable
  // while still speeding up dramatically through perihelion.
  if(cometPlaying) cometE=(cometE+dt*.28)%(Math.PI*2);
  const ce=Math.cos(cometE), se=Math.sin(cometE), d=1-COMET.e*ce;
  const rAu=COMET.a*d;
  const cosNu=(ce-COMET.e)/d, sinNu=Math.sqrt(1-COMET.e*COMET.e)*se/d;
  const R=s(rAu), xo=R*cosNu, yo=R*sinNu;
  cometHead.position.set(xo,yo*Math.sin(COMET.inc),yo*Math.cos(COMET.inc));

  // Tail lengthens and brightens as sunlight boils off more ice
  const len=Math.min(26,20/Math.pow(Math.max(rAu,.6),.42));
  const anti=cometHead.position.clone().normalize();
  cometTail.position.copy(cometHead.position);
  cometTail.quaternion.setFromUnitVectors(X_AXIS,anti);
  cometTail.scale.setScalar(len);
  cometTail.material.opacity=Math.max(0,Math.min(.9,1.6-rAu/45));
  cometTail.visible=cometTail.material.opacity>.02;

  const el=document.getElementById('comet-dist');
  if(el)el.textContent=rAu<10?rAu.toFixed(1)+' AU':Math.round(rAu)+' AU';
}

window.toggleComet=function(){
  cometPlaying=!cometPlaying;
  document.getElementById('comet-btn').textContent=cometPlaying?'❚❚ Pause comet':'▶ Play comet';
};

// ─── Raycasting ──────────────────────────────────────────────────────────────
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const tooltip=document.getElementById('tooltip');

function visible(o){ let n=o; while(n){ if(!n.visible)return false; n=n.parent; } return true; }

function getIntersect(e){
  const x=e.clientX??0, y=e.clientY??0;
  mouse.x=(x/innerWidth)*2-1;
  mouse.y=-(y/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  // Named bodies win over dust so an object inside the belt stays selectable
  const objHits=raycaster.intersectObjects(clickables.filter(visible),false);
  if(objHits.length)return objHits[0];
  raycaster.params.Points.threshold=Math.max(.8,camera.position.length()*.01);
  const regHits=raycaster.intersectObjects(regionClouds.filter(visible),false);
  return regHits.length?regHits[0]:null;
}

let hoverPending=false;
canvas.addEventListener('mousemove',e=>{
  if(hoverPending)return;             // throttle to one test per frame
  hoverPending=true;
  requestAnimationFrame(()=>{
    hoverPending=false;
    const hit=getIntersect(e);
    if(hit){
      tooltip.textContent=hit.object.userData.data.name;
      tooltip.style.display='block';
      tooltip.style.left=(e.clientX+16)+'px';
      tooltip.style.top=(e.clientY-12)+'px';
      canvas.style.cursor='pointer';
    } else {
      tooltip.style.display='none';
      canvas.style.cursor='default';
    }
  });
});

// Orbiting ends in a click event, so only count it if the pointer barely moved
let downAt=null;
canvas.addEventListener('pointerdown',e=>{downAt={x:e.clientX,y:e.clientY};});
canvas.addEventListener('click',e=>{
  if(downAt&&Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>5)return;
  const hit=getIntersect(e);
  if(hit)openPanel(hit.object.userData);
});

// ─── Info panel ──────────────────────────────────────────────────────────────
function openPanel(ud){
  const d=ud.data;
  document.getElementById('p-title').textContent=d.name;
  document.getElementById('p-sub').textContent=d.type||d.sub||'';
  document.getElementById('p-stats').innerHTML=
    Object.entries(d.stats||{}).map(([k,v])=>
      `<div class="stat"><div class="stat-lbl">${k}</div><div class="stat-val">${v}</div></div>`).join('');
  document.getElementById('panel-desc').textContent=d.desc||'';
  document.getElementById('p-comp').innerHTML=(d.comp&&d.comp.length)
    ? '<div class="comp-title">What it is made of</div>'+d.comp.map(c=>
        `<div class="comp-row"><div class="comp-lbl">${c.l}</div>`+
        `<div class="comp-bg"><div class="comp-fill" style="width:${c.p}%;background:${c.c}"></div></div>`+
        `<div class="comp-pct">${c.p}%</div></div>`).join('')
    : '';
  document.getElementById('info-panel').style.display='block';
}
window.closePanel=()=>{document.getElementById('info-panel').style.display='none';};

// ─── Camera flight ───────────────────────────────────────────────────────────
let flyStart=null,flyFrom,flyTo_,flyFromT,flyToT;
const FLY_MS=1500;
function flyToVec(pos,tgt){
  flyStart=performance.now();
  flyFrom=camera.position.clone(); flyFromT=controls.target.clone();
  flyTo_=pos.clone();              flyToT=tgt.clone();
}
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

window.focusObject=function(id){
  const m=objMeshes[id]; if(!m||!visible(m))return;
  const p=m.getWorldPosition(new THREE.Vector3());
  const back=Math.max(9,p.length()*.2);
  flyToVec(p.clone().add(p.clone().normalize().multiplyScalar(back)).add(new THREE.Vector3(0,back*.5,0)),p);
  openPanel(m.userData);
};

// ─── Modes: Kuiper Belt and Oort Cloud are shown separately ──────────────────
const MODES={
  kuiper:{ title:'Kuiper Belt', sub:'The icy disk beyond Neptune · 30–55 AU',
           cam:new THREE.Vector3(0,64,142), min:3,  max:210 }, // far enough to frame the whole ring
  oort:  { title:'Oort Cloud',  sub:'A shell wrapped around the entire solar system · 2,000–100,000 AU',
           cam:new THREE.Vector3(0,120,330), min:60, max:620 },
  exo:   { title:'Other Stars', sub:'Debris disks around nearby stars — Kuiper Belts elsewhere · 4–133 ly',
           cam:new THREE.Vector3(0,150,430), min:120,max:620 },
};
let mode='kuiper';

window.setMode=function(m){
  mode=m;
  const cfg=MODES[m];
  oortGroup.visible = (m==='oort'||m==='exo');
  exoGroup.visible  = (m==='exo');
  // Probes and the heliopause only make sense at belt scale; past that they sit
  // in a single pixel at the centre and just add clutter.
  probeGroup.visible = (m==='kuiper');
  edgeGroup.visible  = (m==='kuiper');
  // The belt stays on in every mode: watching it shrink to a speck inside the
  // Oort shell is the whole point of the scale comparison.
  kuiperGroup.visible = true;
  controls.minDistance=cfg.min;
  controls.maxDistance=cfg.max;
  document.getElementById('view-title').textContent=cfg.title;
  document.getElementById('view-sub').textContent=cfg.sub;
  ['kuiper','oort','exo'].forEach(k=>
    document.getElementById('btn-'+k).classList.toggle('active',m===k));
  flyToVec(cfg.cam,new THREE.Vector3(0,0,0));
  closePanel();
  buildList();
};

// ─── Sidebar list, filtered to the active mode ───────────────────────────────
const hex=c=>'#'+c.toString(16).padStart(6,'0');
function buildList(){
  const row=(id,name,color)=>`<button class="obj-btn" data-id="${id}">`+
    `<span class="obj-dot" style="background:${color}"></span>${name}</button>`;
  const section=(label,rows)=>rows.length?`<div class="grp">${label}</div>`+rows.join(''):'';
  let html='';

  if(mode==='exo'){
    html+=section('Stars with Debris Disks',
      EXOSYSTEMS.map(x=>row(x.name,x.name,hex(x.color))));
    html+=section('Our Own System',
      ['inner_oort','outer_oort'].map(k=>
        `<button class="obj-btn" data-region="${k}">`+
        `<span class="obj-dot" style="background:#dfeaf2"></span>${REGIONS[k].name}</button>`));
  } else {
    const regionKeys = mode==='kuiper' ? ['kuiper','scattered'] : ['inner_oort','outer_oort'];
    html+=section('Regions — click for composition', regionKeys.map(k=>
      `<button class="obj-btn" data-region="${k}">`+
      `<span class="obj-dot" style="background:#dfeaf2"></span>${REGIONS[k].name}</button>`));

    if(mode==='kuiper'){
      html+=section('Boundary',[
        `<button class="obj-btn" data-heliopause="1">`+
        `<span class="obj-dot" style="background:#7fe4ee"></span>The Heliopause</button>`]);
    }

    const bodies=OBJECTS.filter(o=>o.region==='both'||o.region===mode||mode==='kuiper');
    html+=section('Dwarf Planets',
      bodies.filter(o=>!o.id.startsWith('hal')).map(o=>row(o.id,o.name,hex(o.color))));
    html+=section('Comets',
      bodies.filter(o=>o.id.startsWith('hal')).map(o=>row(o.id,o.name,hex(o.color)))
        .concat([row('comet','Long-Period Comet','#ffffff')]));

    if(mode==='kuiper'){
      html+=section('Spacecraft Out There',
        SPACECRAFT.map(sc=>row(sc.name,sc.name,hex(sc.color))));
      html+=section('Planets',
        PLANETS.slice().reverse().map(p=>row(p.name,p.name,hex(p.color))));
    }
  }
  document.getElementById('obj-list').innerHTML=html;
}
document.getElementById('obj-list').addEventListener('click',e=>{
  const b=e.target.closest('.obj-btn'); if(!b)return;
  if(b.dataset.region)openPanel({data:REGIONS[b.dataset.region]});
  else if(b.dataset.heliopause)openPanel({data:HELIOPAUSE});
  else focusObject(b.dataset.id);
});

// ─── Resize (per-frame; resize events don't fire inside embedded panes) ──────
function syncSize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h)return;
  const dpr=Math.min(devicePixelRatio,2);
  if(canvas.width!==Math.floor(w*dpr)||canvas.height!==Math.floor(h*dpr)){
    renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.updateProjectionMatrix();
  }
}

// ─── Animate ─────────────────────────────────────────────────────────────────
let lastNow=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  syncSize();
  const dt=Math.min((now-lastNow)/1000,.05); // clamp so tab-switches don't jump
  lastNow=now;
  updateComet(dt);

  if(flyStart!==null){
    const t=Math.min((now-flyStart)/FLY_MS,1),e=easeInOut(t);
    camera.position.lerpVectors(flyFrom,flyTo_,e);
    controls.target.lerpVectors(flyFromT,flyToT,e);
    if(t>=1)flyStart=null;
  }

  // Slow drift keeps the scene alive without making bodies hard to click
  OBJECTS.forEach((obj,i)=>{
    const m=objMeshes[obj.id]; if(!m)return;
    const r=s(obj.au),inc=obj.inc*Math.PI/180*.3;
    const a=obj.phi+now*(.0002+i*.00003)*.012;
    m.position.set(r*Math.cos(a)*Math.cos(inc),r*Math.sin(inc),r*Math.sin(a)*Math.cos(inc));
  });

  controls.update();
  renderer.render(scene,camera);
}

// #oort / #kuiper opens straight into that view
const startMode = location.hash.slice(1)==='oort' ? 'oort' : 'kuiper';
setMode(startMode);
flyStart=null;                       // land on the view directly, no intro flight
camera.position.copy(MODES[startMode].cam);

const loadEl=document.getElementById('loading');
loadEl.style.opacity='0';
setTimeout(()=>loadEl.style.display='none',700);

animate(performance.now());
</script>
